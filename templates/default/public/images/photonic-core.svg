<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Photoniuum photonic core schematic (stylized)">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="blur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg2)"/>

  <!-- outer casing -->
  <rect x="220" y="120" width="760" height="280" rx="28" fill="#0f172a" stroke="#1f2a44" stroke-width="6"/>

  <!-- core chamber -->
  <rect x="420" y="160" width="360" height="200" rx="22" fill="#0b1020" stroke="#1f2a44" stroke-width="6"/>
  <circle cx="600" cy="260" r="70" fill="url(#glow)" opacity="0.18" filter="url(#blur2)"/>
  <circle cx="600" cy="260" r="28" fill="#eaf0ff"/>
  <circle cx="600" cy="260" r="52" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.9"/>

  <!-- flux channels -->
  <path d="M420 200H300" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M420 320H300" stroke="#a5b4fc" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M780 200H900" stroke="#a5b4fc" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <path d="M780 320H900" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- small labels -->
  <g fill="#eaf0ff" opacity="0.75" font-family="Arial, sans-serif" font-size="20">
    <text x="260" y="110">CASING</text>
    <text x="470" y="150">CORE CHAMBER</text>
    <text x="265" y="220">FLUX IN</text>
    <text x="265" y="340">FLUX IN</text>
    <text x="875" y="220">FLUX OUT</text>
    <text x="875" y="340">FLUX OUT</text>
  </g>
</svg>


