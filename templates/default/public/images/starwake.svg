<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Photoniuum starwake illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="wake" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#93c5fd" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eaf0ff"/>
      <stop offset="1" stop-color="#eaf0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>

  <!-- stars -->
  <g opacity="0.85">
    <circle cx="120" cy="90" r="2" fill="#eaf0ff"/>
    <circle cx="220" cy="140" r="1.5" fill="#eaf0ff"/>
    <circle cx="340" cy="70" r="1.2" fill="#eaf0ff"/>
    <circle cx="520" cy="110" r="1.8" fill="#eaf0ff"/>
    <circle cx="760" cy="80" r="1.4" fill="#eaf0ff"/>
    <circle cx="980" cy="160" r="1.6" fill="#eaf0ff"/>
    <circle cx="1060" cy="90" r="1.1" fill="#eaf0ff"/>
    <circle cx="900" cy="60" r="1.0" fill="#eaf0ff"/>
    <circle cx="640" cy="170" r="1.0" fill="#eaf0ff"/>
    <circle cx="420" cy="190" r="1.1" fill="#eaf0ff"/>
  </g>

  <!-- starwake -->
  <path d="M120 350 C 300 260, 520 310, 720 230 S 1100 170, 1160 140"
        fill="none" stroke="url(#wake)" stroke-width="46" stroke-linecap="round" filter="url(#blur)"/>
  <path d="M140 352 C 320 270, 520 322, 740 244 S 1090 182, 1166 150"
        fill="none" stroke="#eaf0ff" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>

  <!-- jump point -->
  <circle cx="1080" cy="190" r="70" fill="url(#star)" opacity="0.9"/>
  <circle cx="1080" cy="190" r="10" fill="#eaf0ff"/>
  <circle cx="1080" cy="190" r="24" fill="none" stroke="#93c5fd" stroke-opacity="0.6" stroke-width="3"/>
</svg>


